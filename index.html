<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnglishConnect Conversation Topic Wheel</title>
<style>
:root{--accent:#5b4bdb;--bg:#f7f7fb;--text:#202124;--muted:#666}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);display:flex;justify-content:center;align-items:center;padding:24px}
main{width:min(700px,100%);text-align:center}
h1{font-size:clamp(24px,5vw,36px);margin:0 0 8px}
.subtitle{color:var(--muted);margin:0 0 22px}
.wheel-area{position:relative;width:min(88vw,520px);aspect-ratio:1;margin:auto}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid var(--accent);z-index:2}
button{margin-top:22px;border:0;border-radius:999px;background:var(--accent);color:white;font-size:18px;font-weight:700;padding:15px 38px;cursor:pointer;min-height:52px}
button:hover{filter:brightness(.95)}
button:disabled{opacity:.6;cursor:default}
.result{margin-top:20px;min-height:74px}
.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.topic{font-size:clamp(22px,5vw,30px);font-weight:700;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>EnglishConnect Conversation Topic Wheel</h1>
<p class="subtitle">Spin the wheel and start a conversation.</p>
<div class="wheel-area">
<div class="pointer" aria-hidden="true"></div>
<canvas id="wheel" aria-label="Random conversation topic wheel"></canvas>
</div>
<button id="spin" type="button">SPIN</button>
<div class="result" aria-live="polite">
<div class="label">Selected topic</div>
<div class="topic" id="result">Spin the wheel</div>
</div>
</main>
<script>
const topics=[
"Introductions","Family and Friends","Interests and Hobbies","Favorite Things","Personality",
"Feelings and Emotions","Daily Life","Goals and Dreams","Strengths and Weaknesses","Memories",
"Childhood","Personal Preferences","Daily Routines","Weekly Routines","Weekend Plans",
"Morning and Evening Routines","Home and Household","Food and Cooking","Grocery Shopping",
"Restaurants and Cafés","Clothing","Shopping","Money and Prices","Phones and Technology",
"Transportation","Weather","Seasons","Time and Schedules","The Neighborhood","The City",
"Places in the Community","Asking for and Giving Directions","Public Transportation",
"Parks and Recreation","Schools and Education","Work and Jobs","Services and Appointments",
"Meeting New People","Holidays","Vacations","Travel Plans","Airports and Flights","Hotels",
"Tourist Attractions","Favorite Places","Travel Experiences","Countries and Cultures",
"Packing for a Trip","Health and Sickness","Injuries","Exercise and Fitness","Sleep",
"Food and Healthy Habits","Visiting a Doctor","Describing Symptoms","Giving Health Advice",
"Making Plans with Friends","Inviting Someone Somewhere","Accepting and Declining Invitations",
"Making Small Talk","Keeping a Conversation Going","Asking Follow-Up Questions","Giving Compliments",
"Giving Advice","Asking for Opinions","Agreeing and Disagreeing","Apologizing","Thanking Someone",
"Asking for Clarification","Describing Someone","Describing a Place","Describing an Experience",
"Movies and TV Shows","Music","Books","Sports","Games","Social Media","Art","Festivals",
"Traditions","Birthdays","Weddings","Other Celebrations","Past Experiences","Childhood Memories",
"Recent Events","Current Activities","Future Plans","Personal Goals","Career Dreams",
"Favorite Food","Favorite Restaurant","Favorite Place in Your City","What You Do When You're Bored",
"Something Interesting You Learned Recently","Something You're Looking Forward To",
"A Place You Would Like to Visit","A Skill You Would Like to Learn","Something You Are Good At",
"Something You Want to Improve","Your Dream Job","Your Ideal Day","A Funny or Interesting Experience",
"Something That Makes You Happy","Something That Helps You Relax",
"Your Favorite Way to Spend Time with Friends","What You Would Do With a Free Day",
"If You Could Travel Anywhere","If You Could Meet Anyone","If You Had a Million Dollars",
"If You Could Learn Any Skill"
];

const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
const btn=document.getElementById("spin"),result=document.getElementById("result");
let angle=0,spinning=false;

function resize(){
  const size=Math.min(520,Math.max(280,Math.floor(Math.min(window.innerWidth-48,520))));
  const dpr=window.devicePixelRatio||1;
  canvas.width=size*dpr; canvas.height=size*dpr;
  canvas.style.width=size+"px"; canvas.style.height=size+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0); draw(size);
}
function draw(size){
  const c=size/2, r=size*.46, step=Math.PI*2/topics.length;
  ctx.clearRect(0,0,size,size);
  ctx.save();ctx.translate(c,c);ctx.rotate(angle);
  for(let i=0;i<topics.length;i++){
    const a=i*step;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a,a+step);ctx.closePath();
    ctx.fillStyle=i%2?"#e5e5e8":"#fafafa";ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.stroke();
  }
  ctx.restore();
  ctx.beginPath();ctx.arc(c,c,r*.105,0,Math.PI*2);
  ctx.fillStyle="#5b4bdb";ctx.fill();
}
function spin(){
  if(spinning)return;
  spinning=true;btn.disabled=true;result.textContent="Spinning…";
  const start=angle;
  const target=start+Math.PI*2*(6+Math.random()*4)+Math.random()*Math.PI*2;
  const duration=4200+Math.random()*700,t0=performance.now();
  function frame(now){
    const p=Math.min(1,(now-t0)/duration),ease=1-Math.pow(1-p,4);
    angle=start+(target-start)*ease;
    draw(canvas.width/(window.devicePixelRatio||1));
    if(p<1){requestAnimationFrame(frame);return}
    angle=((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    const step=Math.PI*2/topics.length;
    const pointerAngle=((Math.PI*2-angle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    const index=Math.floor(pointerAngle/step);
    result.textContent=topics[index];
    spinning=false;btn.disabled=false;
  }
  requestAnimationFrame(frame);
}
btn.addEventListener("click",spin);
window.addEventListener("resize",resize);
resize();
</script>
</body>
</html>
